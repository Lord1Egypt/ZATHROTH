name: zathroth

x-runtime: &runtime
  image: "${ZATHROTH_IMAGE:-ghcr.io/lord1egypt/zathroth:latest}"
  restart: unless-stopped
  init: true
  # The server runs from this folder: it reads data/, data-otservbr-global/
  # and config.lua.dist here, downloads the map into
  # data-otservbr-global/world/ on the first start, and keeps the SQLite
  # database in ./database/.
  volumes:
    - .:/opt/zathroth

x-bind-ip: &bind-ip "${ZATHROTH_BIND_IP:-${ZATHROTH_SERVER_IP:-192.168.1.104}}"
x-network-config: &network-config
  ZATHROTH_SERVER_IP: "${ZATHROTH_SERVER_IP:-192.168.1.104}"
  ZATHROTH_GAME_PORT: "${ZATHROTH_GAME_PORT:-7172}"
  ZATHROTH_ACCOUNT_PORT: "${ZATHROTH_ACCOUNT_PORT:-8088}"

services:
  game:
    <<: *runtime
    stop_grace_period: 45s
    environment:
      <<: *network-config
      ZATHROTH_LOGIN_PORT: "${ZATHROTH_LOGIN_PORT:-7171}"
    ports:
      - host_ip: *bind-ip
        published: "${ZATHROTH_LOGIN_PORT:-7171}"
        target: "${ZATHROTH_LOGIN_PORT:-7171}"
      - host_ip: *bind-ip
        published: "${ZATHROTH_GAME_PORT:-7172}"
        target: "${ZATHROTH_GAME_PORT:-7172}"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import os
          import socket
          port = int(os.environ["ZATHROTH_GAME_PORT"])
          socket.create_connection(("127.0.0.1", port), timeout=2).close()
      interval: 30s
      timeout: 3s
      retries: 8
      # The first start downloads the map, and loading it takes minutes on
      # small ARM boards.
      start_period: 15m

  accounts:
    <<: *runtime
    command: ["accounts"]
    environment:
      <<: *network-config
      # "off" removes the CAPTCHA from account registration (private LAN
      # installs and the CI smoke test, which cannot solve a picture).
      ZATHROTH_CAPTCHA: "${ZATHROTH_CAPTCHA:-on}"
      # Only the HTTPS proxy below may say who the real visitor is.
      ZATHROTH_TRUSTED_PROXY: proxy
      # When ZATHROTH_SERVER_IP is a public host name, clients on the home
      # network are sent this address to reach the game instead.
      ZATHROTH_LAN_IP: "${ZATHROTH_LAN_IP:-}"
      ZATHROTH_CLIENT_URL: "${ZATHROTH_CLIENT_URL:-}"
    ports:
      - host_ip: *bind-ip
        published: "${ZATHROTH_ACCOUNT_PORT:-8088}"
        target: "${ZATHROTH_ACCOUNT_PORT:-8088}"
    depends_on:
      game:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import os
          import urllib.request
          port = os.environ["ZATHROTH_ACCOUNT_PORT"]
          urllib.request.urlopen(f"http://127.0.0.1:{port}/health", timeout=2).close()
      interval: 30s
      timeout: 3s
      retries: 6

  # HTTPS for the account service. Enable it with COMPOSE_PROFILES=https and
  # ZATHROTH_DOMAIN=<your host name> in .env; see the README.
  proxy:
    profiles: ["https"]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ZATHROTH_DOMAIN: "${ZATHROTH_DOMAIN:-localhost}"
      # Point this at https://acme-staging-v02.api.letsencrypt.org/directory to
      # test without touching Let's Encrypt's real rate limits.
      ZATHROTH_ACME_CA: "${ZATHROTH_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the ACME account; kept in the cloned folder like the database.
      - ./database/caddy:/data
    ports:
      - host_ip: *bind-ip
        published: "${ZATHROTH_HTTP_PORT:-80}"
        target: 80
      - host_ip: *bind-ip
        published: "${ZATHROTH_HTTPS_PORT:-443}"
        target: 443
    depends_on:
      accounts:
        condition: service_healthy
