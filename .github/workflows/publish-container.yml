name: Publish ZATHROTH container

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: zathroth-container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and smoke test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      COMPOSE_PROJECT_NAME: zathroth-smoke
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          ARCH: ${{ matrix.arch }}
        run: echo "tag=ghcr.io/${REPOSITORY,,}:${GITHUB_SHA}-${ARCH}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build native image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max,ignore-error=true

      - name: Start the game and account manager
        env:
          ZATHROTH_IMAGE: ${{ steps.image.outputs.tag }}
          ZATHROTH_SERVER_IP: 127.0.0.1
        run: |
          docker compose up -d --pull never --wait --wait-timeout 150
          docker compose logs --no-color game > zathroth-startup.log
          rg -F "Compiled by Mohamed Mounir" zathroth-startup.log
          rg -F "akim.221992@gmail.com" zathroth-startup.log
          python3 .github/scripts/zathroth-smoke.py
          docker compose exec -T accounts python3 - <<'PYTHON'
          import os
          import sqlite3
          with sqlite3.connect(f"file:{os.environ['ZATHROTH_DB_PATH']}?mode=ro", uri=True) as db:
              assert db.execute("PRAGMA integrity_check").fetchall() == [("ok",)]
              assert db.execute("PRAGMA foreign_key_check").fetchall() == []
              assert db.execute("SELECT 1 FROM towns LIMIT 1").fetchone() is not None
          PYTHON

      - name: Save server logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the smoke-test stack
        if: always()
        run: docker compose down -v

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push architecture image
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: docker push "$IMAGE"

  publish:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish and inspect multi-architecture manifest
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          docker buildx imagetools create \
            --tag "$image:latest" --tag "$image:$GITHUB_SHA" \
            "$image:$GITHUB_SHA-amd64" "$image:$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$image:latest"
